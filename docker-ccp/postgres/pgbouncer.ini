[databases]
ccp_db = host=postgres port=5432 dbname=ccp_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = ccp_admin
stats_users = ccp_monitor
pool_mode = session
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 100
server_idle_timeout = 300
server_connect_timeout = 15
server_login_retry = 15
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
