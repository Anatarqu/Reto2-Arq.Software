events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    log_format ccp_format '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time" '
                          'upstream=$upstream_addr idemp="$http_x_idempotency_key"';

    access_log /var/log/nginx/access.log ccp_format;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Rate Limiting Zones (ASR DISP-02)
    limit_req_zone $binary_remote_addr zone=ip_perimetro:10m rate=150r/s;
    limit_req_status 429;

    # Upstream Activo-Pasivo (Warm Backup) - ASR AD-D1 & DISP-01
    upstream sales_cluster {
        server svc-ventas-main:8000 max_fails=3 fail_timeout=15s;
        server svc-ventas-spare:8000 backup;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost ccp-api.local;

        # Cabeceras de Seguridad Perimetral
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 1. Endpoint de Monitoreo de Salud Profunda (Deep Health Check)
        location /health/deep {
            proxy_pass http://sales_cluster/health/deep;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
            proxy_next_upstream error timeout http_500 http_502 http_503;
        }

        # 2. Rutas del Dominio de Ventas y Pedidos
        location /api/v1/pedidos {
            limit_req zone=ip_perimetro burst=50 nodelay;

            proxy_pass http://sales_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Idempotency-Key $http_x_idempotency_key;
            proxy_set_header X-Vendedor-Id $http_x_vendedor_id;
            proxy_set_header Authorization $http_authorization;

            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_timeout 15s;
            proxy_next_upstream_tries 2;
        }

        # 3. Consulta de Clientes (Sujeto a ABAC y RLS)
        location /api/v1/clientes {
            proxy_pass http://sales_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Vendedor-Id $http_x_vendedor_id;
            proxy_set_header Authorization $http_authorization;
        }

        # 4. Ingesta de Eventos de Seguridad hacia el Motor UEBA
        location /api/v1/sec/events {
            proxy_pass http://ueba-worker:8005/events;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 5. Endpoint de Simulación de Fallas (para Experimento E01)
        location /simulate/ {
            proxy_pass http://svc-ventas-main:8000/simulate/;
        }
    }
}
